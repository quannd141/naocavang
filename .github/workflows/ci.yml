name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nao_ca_vang
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: nao_ca_vang_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://nao_ca_vang:dev_password@localhost:5432/nao_ca_vang_test?schema=public
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: ci_test_secret_at_least_32_characters_long
      NEXTAUTH_URL: http://localhost:3000
      # All upstream services mocked in tests
      GEMINI_API_KEY: ci_fake_key
      ANTHROPIC_API_KEY: ci_fake_key
      NIGHT_SHIFT_MODE: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @nao-ca-vang/api db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Prisma migrate (test DB)
        run: pnpm --filter @nao-ca-vang/api exec prisma migrate deploy

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

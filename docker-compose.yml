services:
  postgres:
    image: postgres:16-alpine
    container_name: nao-ca-vang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nao_ca_vang
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: nao_ca_vang_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nao_ca_vang -d nao_ca_vang_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nao-ca-vang-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
